name: Infra

# Checks for the Terraform / OpenTofu code in infra/. No cloud credentials are
# needed for the first four jobs. The optional "plan" job only runs when you
# configured the read-only plan role (see docs/infra/SETUP.md) and skips cleanly
# otherwise.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.54.0"
  CHECKOV_VERSION: "3.2.334"
  TF_IN_AUTOMATION: "true"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  validate:
    name: Format, validate, plan-time tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Format check
        run: terraform fmt -check -recursive -diff infra

      # Modules are validated through the stack that calls them (modules that need a
      # provider alias, such as dns and backup, cannot be validated on their own).
      - name: Validate the stacks and their modules
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra/stacks/prod; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Plan-time tests (mocked AWS, no credentials)
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra/stacks/prod; do
            echo "::group::test $dir"
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Install rule sets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"

      - name: Lint
        working-directory: infra
        run: tflint --config="$GITHUB_WORKSPACE/infra/.tflint.hcl" --recursive --format compact

  policy-scan:
    name: Misconfiguration scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install --no-cache-dir "checkov==${CHECKOV_VERSION}"

      # Any finding that is not in infra/.checkov.yaml (with a written reason) fails the job.
      - name: Scan
        working-directory: infra
        run: checkov --config-file .checkov.yaml -d .

  plan:
    name: Terraform plan (optional)
    # Skips cleanly unless AWS_PLAN_ROLE_ARN is set as a repository variable and the
    # pull request comes from this repository (forks never get cloud access).
    if: ${{ vars.AWS_PLAN_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Sign in to AWS (read-only role, OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Write the non-secret inputs
        env:
          OWNER_TFVARS: ${{ vars.INFRA_OWNER_TFVARS }}
          BACKEND_HCL: ${{ vars.INFRA_BACKEND_HCL }}
        run: |
          set -euo pipefail
          if [ -z "$OWNER_TFVARS" ] || [ -z "$BACKEND_HCL" ]; then
            echo "::error::Set repository variables INFRA_OWNER_TFVARS (contents of owner.tfvars) and INFRA_BACKEND_HCL (contents of backend.hcl). They contain no secrets."
            exit 1
          fi
          printf '%s\n' "$OWNER_TFVARS" > infra/stacks/prod/owner.tfvars
          printf '%s\n' "$BACKEND_HCL" > infra/stacks/prod/backend.hcl

      - name: Plan
        working-directory: infra/stacks/prod
        env:
          PROFILE: ${{ vars.INFRA_PROFILE || 'lean' }}
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -lock=false -no-color \
            -var-file="../../profiles/${PROFILE}.tfvars" -var-file=owner.tfvars | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            tail -n 200 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
