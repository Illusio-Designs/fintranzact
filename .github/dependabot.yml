# Dependabot opens pull requests for version updates and security updates. It never merges them:
# every PR needs the normal required checks and a human review (do NOT add an auto-merge workflow).
# Security updates ignore the limits below and open straight away.
version: 2
updates:
  # npm: one entry covers the whole pnpm workspace (root, packages/*, apps/*) through the lockfile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
