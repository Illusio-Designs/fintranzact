# Secret-shaped strings in source (see also .gitleaks.toml, which scans history).
# Kept in its own file because the generic-language rule cannot share a --test run with the others.
rules:
  - id: fintranzact-hardcoded-secret
    languages: [generic]
    severity: ERROR
    message: >-
      Something that looks like a live credential is in the source (Razorpay, Sandbox.co.in, Anthropic,
      AWS or a private key). Remove it, rotate it, and read it from the environment.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 Identification and Authentication Failures"
    paths:
      exclude:
        - "__tests__"
        - "*.test.ts"
        - "*.test.tsx"
        - "*.spec.ts"
        - "*.md"
        - "*.mdx"
        - ".env.example"
        - ".env.prod.example"
    pattern-either:
      - pattern-regex: rzp_live_(?!X{6})[A-Za-z0-9]{10,}
      - pattern-regex: key_live_[a-f0-9]{20,}
      - pattern-regex: sk-ant-[A-Za-z0-9_-]{20,}
      - pattern-regex: AKIA[0-9A-Z]{16}
      - pattern-regex: -----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----
