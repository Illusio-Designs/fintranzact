name: Deploy Web

# Vercel's Git auto-deploys are disabled (apps/web/vercel.json), so branch
# pushes no longer create preview deployments. Production deploys are
# triggered here via a Vercel Deploy Hook, only for pushes to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger Vercel deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
